<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Haltestelle</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; padding: 0 1rem; }
    h1 { font-size: 1.4rem; }
    .row { display: flex; gap: 0.5rem; }
    input { flex: 1; padding: 0.55rem; font-size: 1rem; }
    button { padding: 0.55rem 0.9rem; font-size: 1rem; cursor: pointer; }
    ul { list-style: none; padding: 0; margin: 0.5rem 0; border: 1px solid #ddd; border-radius: 4px; }
    ul:empty { display: none; }
    li { padding: 0.5rem 0.7rem; cursor: pointer; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; gap: 1rem; }
    li:last-child { border-bottom: none; }
    li:hover { background: #f2f6ff; }
    li small { color: #999; white-space: nowrap; }
    #current { margin-top: 1rem; font-weight: 600; }
    #status { color: #666; min-height: 1.2em; }
    .hint { color: #999; font-size: 0.85rem; }

    #filters {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
      gap: 0.4rem; margin: 1.6rem 0; padding: 0.7rem 0.9rem;
      border: 1px solid #ddd; border-radius: 14px;
    }
    .filter-btn {
      /* The logo is the button. Common height, natural width per logo. */
      height: 2.9rem;
      display: flex; align-items: center; justify-content: center;
      padding: 0; border: none; background: none; cursor: pointer;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      transition: filter 0.15s, opacity 0.15s, transform 0.08s;
    }
    .filter-btn img { height: 100%; width: auto; max-width: 5rem; display: block; }
    .filter-btn[aria-pressed="false"] { filter: saturate(0.2); opacity: 0.45; }
    .filter-btn:active { transform: scale(0.92); }
  </style>
</head>
<body>
  <h1>Haltestelle</h1>

  <div class="row">
    <input id="q" placeholder="Station name" autocomplete="off" />
    <button id="search-btn" type="button">Search online</button>
  </div>

  <ul id="results"></ul>

  <p id="status"></p>
  <p id="current"></p>

  <div id="filters"></div>

  <script>
    const q = document.getElementById("q");
    const results = document.getElementById("results");
    const status = document.getElementById("status");
    const current = document.getElementById("current");
    const searchBtn = document.getElementById("search-btn");

    function showCurrent(st) {
      current.textContent = st && st.name ? "Selected: " + st.name : "No station selected.";
    }

    function render(list, source) {
      results.innerHTML = "";
      list.forEach((s) => {
        const li = document.createElement("li");
        const label = document.createElement("span");
        label.textContent = s.name;
        const tag = document.createElement("small");
        tag.textContent = source;
        li.append(label, tag);
        li.addEventListener("click", () => select(s));
        results.appendChild(li);
      });
    }

    async function select(s) {
      status.textContent = "Saving…";
      results.innerHTML = "";
      try {
        const res = await fetch("/api/station", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: s.id, name: s.name, short_name: s.short_name }),
        });
        if (!res.ok) throw new Error(res.statusText);
        showCurrent(await res.json());
        status.textContent = "";
        q.value = "";
      } catch (e) {
        status.textContent = "Error: " + e.message;
      }
    }

    // Live typeahead over locally-known stations (cheap, offline).
    let debounce;
    q.addEventListener("input", () => {
      clearTimeout(debounce);
      const term = q.value.trim();
      if (!term) { results.innerHTML = ""; return; }
      debounce = setTimeout(async () => {
        try {
          const res = await fetch("/api/stations?q=" + encodeURIComponent(term));
          render(await res.json(), "known");
        } catch { /* ignore typeahead errors */ }
      }, 200);
    });

    // Explicit online lookup via the EFA stopfinder.
    searchBtn.addEventListener("click", async () => {
      const term = q.value.trim();
      if (!term) return;
      status.textContent = "Searching…";
      try {
        const res = await fetch("/api/stations/lookup?q=" + encodeURIComponent(term));
        if (!res.ok) throw new Error("lookup failed");
        const list = await res.json();
        status.textContent = list.length ? "" : "No stations found.";
        render(list, "online");
      } catch (e) {
        status.textContent = "Error: " + e.message;
      }
    });

    // --- vehicle class filters ---------------------------------------------

    // Operator marks are the Wikimedia Commons originals; tram and bus are ours.
    const ICONS = {
      sbahn: '<img src="/assets/sbahn.svg" alt="">',
      ubahn: '<img src="/assets/ubahn.svg" alt="">',
      tram: '<img src="/assets/tram.svg" alt="">',
      bus: '<img src="/assets/bus.svg" alt="">',
      train: '<img src="/assets/db.svg" alt="">',
    };

    // `classes` are EFA product.class values. Excluding 13-16 also drops the
    // class 0 Ersatzverkehr umbrella, so it needs no button of its own.
    const FILTERS = [
      { key: "sbahn", label: "S-Bahn", classes: [1] },
      { key: "ubahn", label: "U-Bahn", classes: [2] },
      { key: "tram", label: "Tram", classes: [4] },
      { key: "bus", label: "Bus", classes: [5, 7] },
      { key: "train", label: "Zug", classes: [13, 14, 15, 16] },
    ];

    const FILTER_STORE = "haltestelle.filters";
    const filtersEl = document.getElementById("filters");

    function loadEnabled() {
      try {
        const saved = JSON.parse(localStorage.getItem(FILTER_STORE));
        if (Array.isArray(saved)) return new Set(saved);
      } catch { /* fall through to the default */ }
      return new Set(FILTERS.map((f) => f.key));
    }

    const enabled = loadEnabled();

    function saveEnabled() {
      try {
        localStorage.setItem(FILTER_STORE, JSON.stringify([...enabled]));
      } catch { /* private mode, keep the in-memory state */ }
    }

    /** Flat list of EFA product.class values to request. The API seam. */
    function selectedClasses() {
      return FILTERS.filter((f) => enabled.has(f.key))
        .flatMap((f) => f.classes)
        .sort((a, b) => a - b);
    }

    function renderFilters() {
      FILTERS.forEach((f) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "filter-btn";
        btn.setAttribute("aria-pressed", String(enabled.has(f.key)));
        btn.setAttribute("aria-label", f.label);
        btn.innerHTML = ICONS[f.key];
        btn.addEventListener("click", () => {
          enabled.has(f.key) ? enabled.delete(f.key) : enabled.add(f.key);
          btn.setAttribute("aria-pressed", String(enabled.has(f.key)));
          saveEnabled();
        });
        filtersEl.appendChild(btn);
      });
    }

    renderFilters();

    // Show the currently selected station on load.
    fetch("/api/station").then((r) => r.json()).then(showCurrent).catch(() => {});
  </script>
</body>
</html>
